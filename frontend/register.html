<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/logo.js" defer></script>
    <script src="/js/common.js" defer></script>
    <script src="/js/pages/register.js" defer></script>
    <title>Đăng ký · mxh</title>
  </head>
  <body>
    <div class="auth">
      <aside class="auth__brand"></aside>
      <main class="auth__main">
        <div class="auth__card">
          <div class="auth__mobile-logo"></div>

          <div id="steps"></div>
          <div class="auth__head">
            <h2>Tạo tài khoản</h2>
            <p id="subtitle">Nhập email của bạn, chúng tôi sẽ gửi mã xác thực.</p>
          </div>

          <!-- Bước 1a: nhập email -->
          <form id="email-form" class="form" novalidate>
            <div id="email-error" class="alert alert--error" hidden></div>
            <label class="field">
              <span class="field__label">Email</span>
              <input id="email" class="input" type="email" autocomplete="email" placeholder="ban@email.com" autofocus />
              <span class="field__hint">Email này sẽ dùng để đăng nhập.</span>
            </label>
            <button id="email-btn" class="btn btn--primary btn--block">Gửi mã OTP</button>
          </form>

          <!-- Bước 1b: nhập OTP -->
          <form id="otp-form" class="form" novalidate hidden>
            <div id="otp-error" class="alert alert--error" hidden></div>
            <div id="otp-info" class="alert alert--success" hidden></div>

            <div class="email-chip">
              <strong id="otp-email"></strong>
              <button id="change-email" type="button" class="link-btn">Đổi email</button>
            </div>

            <div class="field">
              <span class="field__label">Mã OTP</span>
              <div id="otp-box"></div>
              <span class="field__hint">Mã có hiệu lực trong 10 phút.</span>
            </div>

            <button id="otp-btn" class="btn btn--primary btn--block">Xác thực</button>

            <p class="otp__resend">
              Chưa nhận được mã?
              <button id="resend" type="button" class="link-btn">Gửi lại mã</button>
            </p>
          </form>

          <p class="auth__foot">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
        </div>
      </main>
    </div>
  </body>
</html>
