<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/logo.js" defer></script>
    <script src="/js/common.js" defer></script>
    <script src="/js/pages/forgot-password.js" defer></script>
    <title>Quên mật khẩu · mxh</title>
  </head>
  <body>
    <div class="auth">
      <aside class="auth__brand"></aside>
      <main class="auth__main">
        <div class="auth__card">
          <div class="auth__mobile-logo"></div>

          <div id="flow">
            <div id="steps"></div>
            <div class="auth__head">
              <h2 id="title">Quên mật khẩu</h2>
              <p id="subtitle">Nhập email đã đăng ký, chúng tôi sẽ gửi mã xác thực.</p>
            </div>

            <!-- Bước 1a: nhập email -->
            <form id="email-form" class="form" novalidate>
              <div id="email-error" class="alert alert--error" hidden></div>
              <label class="field">
                <span class="field__label">Email</span>
                <input id="email" class="input" type="email" autocomplete="email" placeholder="ban@email.com" autofocus />
              </label>
              <button id="email-btn" class="btn btn--primary btn--block">Gửi mã OTP</button>
            </form>

            <!-- Bước 1b: nhập OTP -->
            <form id="otp-form" class="form" novalidate hidden>
              <div id="otp-error" class="alert alert--error" hidden></div>
              <div id="otp-info" class="alert alert--success" hidden></div>

              <div class="email-chip">
                <strong id="otp-email"></strong>
                <button id="change-email" type="button" class="link-btn">Đổi email</button>
              </div>

              <div class="field">
                <span class="field__label">Mã OTP</span>
                <div id="otp-box"></div>
                <span class="field__hint">Mã có hiệu lực trong 10 phút.</span>
              </div>

              <button id="otp-btn" class="btn btn--primary btn--block">Xác thực</button>

              <p class="otp__resend">
                Chưa nhận được mã?
                <button id="resend" type="button" class="link-btn">Gửi lại mã</button>
              </p>
            </form>

            <!-- Bước 2: đặt mật khẩu mới -->
            <form id="password-form" class="form" novalidate hidden>
              <div id="password-error" class="alert alert--error" hidden></div>

              <label class="field">
                <span class="field__label">Mật khẩu mới<span class="req">*</span></span>
                <div class="input-group">
                  <input id="password" class="input" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" />
                  <button type="button" class="input-group__btn" tabindex="-1">Hiện</button>
                </div>
              </label>

              <label class="field">
                <span class="field__label">Nhập lại mật khẩu<span class="req">*</span></span>
                <div class="input-group">
                  <input id="confirm-password" class="input" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" />
                  <button type="button" class="input-group__btn" tabindex="-1">Hiện</button>
                </div>
              </label>

              <button id="password-btn" class="btn btn--primary btn--block">Đổi mật khẩu</button>
            </form>

            <p class="auth__foot"><a href="/login">← Quay lại đăng nhập</a></p>
          </div>

          <!-- Xong -->
          <div id="done" hidden>
            <div class="auth__head">
              <h2>Đổi mật khẩu thành công</h2>
              <p>Bạn có thể đăng nhập bằng mật khẩu mới.</p>
            </div>
            <a href="/login" class="btn btn--primary btn--block">Về trang đăng nhập</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
