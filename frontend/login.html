<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/logo.js" defer></script>
    <script src="/js/common.js" defer></script>
    <script src="/js/pages/login.js" defer></script>
    <title>Đăng nhập · mxh</title>
  </head>
  <body>
    <div class="auth">
      <aside class="auth__brand"></aside>
      <main class="auth__main">
        <div class="auth__card">
          <div class="auth__mobile-logo"></div>

          <div class="auth__head">
            <h2>Đăng nhập</h2>
            <p>Chào mừng bạn quay lại.</p>
          </div>

          <form id="login-form" class="form" novalidate>
            <div id="error" class="alert alert--error" hidden></div>

            <label class="field">
              <span class="field__label">Email</span>
              <input id="email" class="input" type="email" autocomplete="email" placeholder="ban@email.com" autofocus />
            </label>

            <label class="field">
              <span class="field__label">Mật khẩu</span>
              <div class="input-group">
                <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" />
                <button type="button" class="input-group__btn" tabindex="-1">Hiện</button>
              </div>
            </label>

            <div class="form__meta">
              <a href="/forgot-password">Quên mật khẩu?</a>
            </div>

            <button id="submit" class="btn btn--primary btn--block">Đăng nhập</button>
          </form>

          <p class="auth__foot">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
        </div>
      </main>
    </div>
  </body>
</html>
